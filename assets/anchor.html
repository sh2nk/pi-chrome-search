<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>pi-chrome-search — anchor</title>
<!--
  P10-A: the anchor control panel.

  A static `file://` asset. The connector paints it with `Runtime.evaluate`, so
  this document has no network of its own: the CSP above forbids every fetch,
  there is no cookie access and no history. `render(state)` uses textContent
  only, never innerHTML, so a query cannot inject markup.

  Keep this file dependency-free: it must render in a browser that has no
  internet access and no extension context.
-->
<style>
  :root {
    color-scheme: light dark;
    --bg: #0f1115; --panel: #171a21; --line: #262b36; --fg: #e6e9ef;
    --dim: #8b93a3; --accent: #6ea8fe; --ok: #4ade80; --warn: #fbbf24; --bad: #f87171;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg: #f5f6f8; --panel: #ffffff; --line: #e3e6ec; --fg: #111418;
      --dim: #5b6472; --accent: #1d4ed8; --ok: #15803d; --warn: #b45309; --bad: #b91c1c; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; padding: 40px 32px; background: var(--bg); color: var(--fg);
    font: 14px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 760px; margin: 0 auto; }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; }
  h1 { font-size: 15px; letter-spacing: .08em; text-transform: uppercase; margin: 0; color: var(--dim); font-weight: 600; }
  #session { font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; color: var(--dim); }
  .card {
    margin-top: 18px; padding: 18px 20px; background: var(--panel);
    border: 1px solid var(--line); border-radius: 14px;
  }
  .row { display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; }
  .label { font-size: 11px; letter-spacing: .09em; text-transform: uppercase; color: var(--dim); }
  #stage {
    display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 12px;
    border: 1px solid var(--line); color: var(--accent);
  }
  #stage[data-state="error"] { color: var(--bad); }
  #stage[data-state="done"] { color: var(--ok); }
  #stage[data-state="pace"] { color: var(--warn); }
  #engine { font-weight: 600; }
  #query { margin: 10px 0 0; font-size: 20px; line-height: 1.3; word-break: break-word; }
  #query.empty { color: var(--dim); font-size: 16px; }
  #meta { margin-top: 14px; display: flex; gap: 22px; flex-wrap: wrap; color: var(--dim); font-size: 13px; }
  #error { margin-top: 14px; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); color: var(--bad); display: none; }
  #error.show { display: block; }
  #error .code { font: 12px ui-monospace, SFMono-Regular, Menlo, monospace; }
  h2 { margin: 0 0 10px; font-size: 11px; letter-spacing: .09em; text-transform: uppercase; color: var(--dim); font-weight: 600; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  td { padding: 6px 0; border-top: 1px solid var(--line); }
  tr:first-child td { border-top: 0; }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  footer { margin-top: 18px; color: var(--dim); font-size: 12px; }
</style>
</head>
<body>
<main>
  <header>
    <h1>pi · chrome · search</h1>
    <span id="session">session —</span>
  </header>

  <section class="card">
    <div class="row">
      <span id="stage" data-state="connect">connect</span>
      <span id="engine">no engine</span>
      <span id="pace"></span>
    </div>
    <p id="query" class="empty">waiting for the first search…</p>
    <div id="error"><span class="code"></span> <span class="hint"></span></div>
    <div id="meta"><span id="updated">—</span></div>
  </section>

  <section class="card">
    <h2>Daily counters</h2>
    <table>
      <tbody>
        <tr><td>google</td><td class="num" id="count-google">—</td></tr>
        <tr><td>duckduckgo</td><td class="num" id="count-duckduckgo">—</td></tr>
        <tr><td>yandex</td><td class="num" id="count-yandex">—</td></tr>
      </tbody>
    </table>
  </section>

  <footer>local page · no network · no cookies · this window is owned by the extension</footer>
</main>
<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  var counters = { google: $("count-google"), duckduckgo: $("count-duckduckgo"), yandex: $("count-yandex") };

  function text(id, value) {
    var node = $(id);
    if (node) node.textContent = value;
  }

  function render(state) {
    if (!state || typeof state !== "object") return;
    var stage = typeof state.stage === "string" ? state.stage : "connect";
    var badge = $("stage");
    if (badge) {
      badge.textContent = stage;
      badge.setAttribute("data-state", stage);
    }
    text("engine", typeof state.engine === "string" ? state.engine : "no engine");
    var query = typeof state.query === "string" ? state.query : "";
    var q = $("query");
    if (q) {
      q.textContent = query || "waiting for the first search…";
      q.className = query ? "" : "empty";
    }
    text("session", "session " + (typeof state.sessionId === "string" ? state.sessionId.slice(0, 8) : "—"));
    var pace = Array.isArray(state.pace) && state.pace.length === 2
      ? "pace " + (state.pace[0] / 1000).toFixed(1) + "–" + (state.pace[1] / 1000).toFixed(1) + " s"
      : "";
    text("pace", pace);

    var list = Array.isArray(state.counters) ? state.counters : [];
    var seen = {};
    for (var i = 0; i < list.length; i += 1) {
      var entry = list[i];
      if (!entry || typeof entry.engine !== "string") continue;
      var cell = counters[entry.engine];
      if (!cell) continue;
      seen[entry.engine] = true;
      cell.textContent = String(entry.today) + " / " + String(entry.cap);
    }
    for (var name in counters) {
      if (!seen[name] && counters[name]) counters[name].textContent = "—";
    }

    var box = $("error");
    if (box) {
      var error = state.error;
      if (error && typeof error.code === "string") {
        box.className = "show";
        box.querySelector(".code").textContent = error.code;
        box.querySelector(".hint").textContent = typeof error.hint === "string" ? error.hint : "";
      } else {
        box.className = "";
        box.querySelector(".code").textContent = "";
        box.querySelector(".hint").textContent = "";
      }
    }
    text("updated", typeof state.updatedAt === "string" ? "updated " + state.updatedAt.replace("T", " ").replace("Z", " UTC") : "—");
  }

  window.__wcsPanel = { render: render };
  window.__wcsPanelReady = true;
})();
</script>
</body>
</html>

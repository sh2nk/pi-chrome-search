name: release
on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "index.ts"
      - "package.json"
      # Release tooling is shipped behaviour too: a change here is a release.
      - "scripts/release.mjs"
      - ".github/workflows/release.yml"
  # Manual "release now" button; still classified from the commits since the
  # last tag, so it is a no-op when nothing classifiable landed.
  workflow_dispatch:
concurrency:
  group: release
  cancel-in-progress: false
permissions:
  contents: write
  # Trusted publishing: npm exchanges this job's OIDC token for a short-lived
  # publish token. No long-lived NPM_TOKEN, no `.npmrc` auth line.
  id-token: write
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # Tag arithmetic needs the history and the tags, not a shallow clone.
          fetch-depth: 0
      - id: node
        run: echo "version=$(node -p "require('./package.json').engines.node.replace(/[^0-9.]/g,'')")" >> "$GITHUB_OUTPUT"
      # No `registry-url`: it makes setup-node write
      # `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}` into `.npmrc`, and a
      # leftover auth line takes precedence over OIDC. The default registry is
      # registry.npmjs.org anyway.
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.node.outputs.version }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - name: bump, tag and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          node scripts/release.mjs
